[workspace]
members = ["dsp", "desktop-shell", "wam-shell", "xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.2.2"
license = "MIT OR Apache-2.0"
authors = ["Casper Leerink"]

[workspace.dependencies]
dsp = { path = "dsp" }

[patch."https://github.com/BillyDM/egui-baseview.git"]
egui-baseview = { path = "vendor/egui-baseview" }
