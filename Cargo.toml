[workspace]
members = ["dsp", "desktop-shell", "wam-shell", "xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.3.0"
license = "MIT OR Apache-2.0"
authors = ["Casper Leerink"]

[workspace.dependencies]
dsp = { path = "dsp" }

# Keep DSP runtime representative during debug/standalone iteration while
# preserving fast incremental builds for the UI/plugin shell crates.
[profile.dev.package.dsp]
opt-level = 3

[patch."https://github.com/BillyDM/egui-baseview.git"]
egui-baseview = { path = "vendor/egui-baseview" }

[patch."https://github.com/RustAudio/baseview.git"]
baseview = { path = "vendor/baseview" }
