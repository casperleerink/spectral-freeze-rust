<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spectral Freeze WAM smoke test</title>
    <style>
      body { font: 14px system-ui, sans-serif; background: #101016; color: #e8e8f0; padding: 2rem; }
      button, input { font: inherit; }
      .row { margin: 0.75rem 0; display: flex; gap: 1rem; align-items: center; }
      label { width: 9rem; color: #8a8a9a; }
    </style>
  </head>
  <body>
    <h1>Spectral Freeze WAM smoke test</h1>
    <p>Serve the repo root over HTTP after building the release wasm:</p>
    <pre>cargo build -p spectral-freeze-wam --target wasm32-unknown-unknown --release
python3 -m http.server 8080</pre>
    <button id="start">Start sine through WAM</button>
    <div id="controls"></div>
    <script type="module">
      import SpectralFreezeWam from "../../wam-shell/js/index.js";

      let audioContext, wamNode;
      document.getElementById("start").onclick = async () => {
        if (audioContext) return;
        audioContext = new AudioContext();
        wamNode = await SpectralFreezeWam.create(audioContext, {
          wasmUrl: "../../target/wasm32-unknown-unknown/release/spectral_freeze_wam.wasm",
          mainChannels: 2,
        });

        const osc = new OscillatorNode(audioContext, { frequency: 220 });
        const gain = new GainNode(audioContext, { gain: 0.15 });
        osc.connect(gain).connect(wamNode).connect(audioContext.destination);
        osc.start();

        const controls = document.getElementById("controls");
        for (const parameter of wamNode.getParameterInfo()) {
          const row = document.createElement("div");
          row.className = "row";
          const label = document.createElement("label");
          label.textContent = parameter.name;
          const input = document.createElement("input");
          input.type = parameter.kind === "bool" ? "checkbox" : "range";
          if (parameter.kind === "bool") {
            input.checked = parameter.default >= 0.5;
            input.oninput = () => wamNode.setParameterValue(parameter.id, input.checked ? 1 : 0);
          } else {
            input.min = parameter.min;
            input.max = parameter.max;
            input.step = 0.001;
            input.value = parameter.default;
            input.oninput = () => wamNode.setParameterValue(parameter.id, Number(input.value));
          }
          row.append(label, input);
          controls.append(row);
        }
      };
    </script>
  </body>
</html>
